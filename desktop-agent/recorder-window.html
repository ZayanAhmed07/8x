<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fathom Capture</title>
  <style>
    :root { --bg:#f6f4ef; --panel:#fffdf8; --ink:#211f1b; --muted:#69645c; --line:#ddd6ca; --soft:#ece7dc; --accent:#0f766e; --accent-strong:#0b5f59; --record:#d92d20; --shadow:0 18px 50px rgba(36,31,25,.12); }
    *{box-sizing:border-box} body{min-height:100vh;margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px} button,input,select{font:inherit}
    button,a.button{display:inline-flex;min-height:38px;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);cursor:pointer;font-weight:750;text-decoration:none;transition:transform .12s ease,border-color .12s ease,background .12s ease} button:hover,a.button:hover{border-color:#bfb7aa;transform:translateY(-1px)} button:disabled{cursor:not-allowed;opacity:.55;transform:none}
    .shell{display:grid;min-height:100vh;grid-template-rows:auto 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px 14px;border-bottom:1px solid var(--line);background:rgba(255,253,248,.72);backdrop-filter:blur(14px)}.brand{display:flex;min-width:0;align-items:center;gap:12px}.mark{display:grid;width:38px;height:38px;place-items:center;border-radius:8px;background:var(--ink);color:#fff;font-weight:900;letter-spacing:.02em}h1{margin:0;font-size:18px;line-height:1.15}p{margin:0;color:var(--muted);line-height:1.45}
    .status{display:inline-flex;min-width:112px;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 10px;color:var(--muted);font-size:12px;font-weight:800}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}.dot.recording{background:var(--record);box-shadow:0 0 0 5px rgba(217,45,32,.16)}main{display:grid;gap:16px;padding:18px 20px 22px}.panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:var(--shadow)}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}.panel-title{font-size:13px;font-weight:850;letter-spacing:.04em;text-transform:uppercase}.panel-body{display:grid;gap:14px;padding:16px}.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
    label{display:grid;gap:7px;color:var(--muted);font-size:12px;font-weight:800}input,select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);padding:9px 11px;outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.13)}.meeting-list{display:grid;gap:8px;max-height:170px;overflow:auto;padding-right:2px}.event-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px}.event-title{overflow:hidden;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.small{color:var(--muted);font-size:12px}.select-event{min-width:76px;padding:0 12px}.source-layout{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 154px;align-items:end}.thumb{width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;background:var(--soft);object-fit:cover}.actions{display:grid;gap:10px;grid-template-columns:1fr}.primary{border-color:var(--accent);background:var(--accent);color:#fff}.primary:hover{border-color:var(--accent-strong);background:var(--accent-strong)}.record{border-color:var(--record);background:var(--record);color:#fff}.record:hover{border-color:#b42318;background:#b42318}.full{width:100%}.hidden{display:none!important}.state-card{display:grid;gap:10px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:14px}.recording-strip{display:flex;align-items:center;justify-content:space-between;gap:12px}#elapsed{font-variant-numeric:tabular-nums}#meetUrl{overflow-wrap:anywhere}@media(max-width:560px){.grid,.source-layout,.actions{grid-template-columns:1fr}.topbar{align-items:flex-start}.status{min-width:auto}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><div class="mark">FC</div><div><h1>Fathom Capture</h1><p id="help">Pair the desktop agent, choose a meeting, then start a manual capture.</p></div></div><span class="status"><span id="statusDot" class="dot"></span><span id="statusText">Ready</span></span></header>
    <main>
      <section class="panel"><div class="panel-header"><span class="panel-title">Connection</span><button id="loadEvents" type="button">Refresh meetings</button></div><div class="panel-body"><div class="grid"><label>Backend URL<input id="appUrl" value="https://fathom8x.vercel.app" placeholder="https://fathom8x.vercel.app" spellcheck="false" /></label><label>Agent token<input id="agentToken" type="password" placeholder="Paste token from Settings" /></label></div><div id="events" class="meeting-list" aria-live="polite"></div></div></section>
      <section class="panel"><div class="panel-header"><span class="panel-title">Capture</span><button id="refresh" type="button">Refresh sources</button></div><div class="panel-body"><label>Meeting title<input id="title" value="Captured meeting" /></label><p id="meetUrl" class="small"></p><button id="openMeet" type="button" class="hidden full">Open meeting</button><div class="source-layout"><label>Capture source<select id="sources"></select></label><img id="preview" class="thumb" alt="Selected source preview" /></div><div id="idle" class="actions"><button id="record" type="button" class="record">Record</button></div><div id="recording" class="state-card hidden"><div class="recording-strip"><span class="status"><span class="dot recording"></span><span id="elapsed">00:00</span></span><button id="stop" type="button" class="record">Stop</button></div></div><div id="uploading" class="state-card hidden"><span class="status">Uploading</span><p id="uploadMessage">Sending recording to the meeting workspace.</p><a id="dashboard" class="button hidden" href="#">View in dashboard</a></div></div></section>
    </main>
  </div>
  <script src="recorder-window.js"></script>
</body>
</html>
